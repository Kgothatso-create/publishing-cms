{% extends "employment/base.html" %}
{% block title %}Employee Dashboard{% endblock %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calendar</title>

    <!-- FullCalendar 7 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.4/all/global.js"></script>

    <!-- FullCalendar Theme -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.4/themes/monarch/global.js"></script>

    <!-- FullCalendar Styles -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.4/skeleton.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.4/themes/monarch/theme.css" rel="stylesheet">

    <style>
        .calendar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #calendar {
            width: 100%;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .calendar-container {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="calendar-container">
    <div id="calendar"></div>
</div>
{{ calendar_events|json_script:"calendar-events" }}
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const calendarElement = document.getElementById("calendar");

        const events = JSON.parse(
            document.getElementById("calendar-events").textContent
        );

        const today = new Date();

        function getDateOffset(days) {
            const date = new Date(today);
            date.setDate(date.getDate() + days);

            return date;
        }

        const calendar = new FullCalendar.Calendar(calendarElement, {

            // Calendar configuration
            initialView: "dayGridMonth",
            firstDay: 1,
            height: "auto",
            nowIndicator: true,

            // Navigation
            headerToolbar: {
                left: "prev,next today",
                center: "title",
                right: "dayGridMonth,timeGridWeek,timeGridDay,listWeek"
            },

            // Calendar interaction
            selectable: true,
            selectMirror: true,
            editable: true,
            dayMaxEvents: true,

            // Event appearance
            eventTimeFormat: {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true
            },

            // Database events
            events: events,

        });

        calendar.render();

    });
</script>
{% endblock %}
