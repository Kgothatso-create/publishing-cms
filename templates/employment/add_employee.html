{% extends "employment/base.html" %}

{% block title %}Add Employee{% endblock %}

{% block hero %}{% endblock %}

{% block content %}

<section class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-5 fw-bold article-title">
            Add Employee
        </h1>
        <a href="{% url 'employee_list' %}"
           class="btn btn-outline-secondary">
            Back
        </a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                {{ field.label }}
                            </label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">
                                    {{ field.errors }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i>
                        Create Employee
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

{% endblock %}
